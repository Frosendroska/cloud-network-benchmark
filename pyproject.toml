[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-network-benchmark"
version = "0.1.0"
description = "Credential-free contracts and orchestration foundation for cross-cloud network benchmarks"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.0,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
  "jsonschema>=4.16,<5",
]

[project.scripts]
cloud-network-benchmark = "cloud_network_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
addopts = "-ra"
